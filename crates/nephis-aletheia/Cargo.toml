[package]
name = "nephis-aletheia"
version = "0.2.0"
edition = "2021"
authors = ["Mohit Raj Deo <mohit@mohitrajdeo.in>"]
description = "NEPHIS Aletheia: Ultra-low-latency in-memory fuel-metered verification engine for AI reasoning and RL rollouts"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mohitrajdeo/extra-features"
homepage = "https://nephis.theeducode.com"
documentation = "https://nephis.theeducode.com"
keywords = ["ai-agents", "verification", "mcp", "symbolic", "nephis"]
categories = ["development-tools", "compilers"]

[lib]
name = "aletheia"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "nephis-aletheia"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
